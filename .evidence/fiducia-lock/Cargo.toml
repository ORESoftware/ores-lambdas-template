[package]
name = "fiducia-lambdas"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
lambda_runtime = "=1.3.0"
ores-middleware = { git = "https://github.com/ORESoftware/ores-middleware.git", rev = "3373e139a03ffa27f7ecb0c97e5df38ee2de4617", package = "ores-middleware", default-features = false, features = ["axum"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.46.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
