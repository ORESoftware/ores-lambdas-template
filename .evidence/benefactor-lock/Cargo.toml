[package]
name = "benefactor-lambdas"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Dependency-only lock witness for the Benefactor Lambda canary; contains no application source."
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = []
aws = ["dep:lambda_runtime", "dep:tokio"]
http = ["dep:axum", "dep:tokio", "dep:flags2env", "dep:ores-middleware", "ores-middleware/axum"]
vercel = ["dep:vercel_runtime", "dep:tokio"]
portable = []

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
lambda_runtime = { version = "1.3.0", optional = true }
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread", "net", "signal"], optional = true }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "tokio"] }
vercel_runtime = { version = "1", optional = true }
flags2env = { git = "https://github.com/ORESoftware/flags-2-env", rev = "b596f2d1c99bd726b262a923916e3015bc80bc37", package = "flags2env", optional = true }
ores-middleware = { git = "https://github.com/ORESoftware/ores-middleware.git", rev = "3373e139a03ffa27f7ecb0c97e5df38ee2de4617", package = "ores-middleware", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[workspace]
