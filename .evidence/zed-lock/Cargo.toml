[package]
name = "zed-lambdas"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["aws"]
aws = ["dep:lambda_runtime", "dep:tokio", "dep:ores-middleware"]
portable = []

[dependencies]
lambda_runtime = { version = "1.3.0", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread"], optional = true }
ores-middleware = { git = "https://github.com/ORESoftware/ores-middleware.git", rev = "3373e139a03ffa27f7ecb0c97e5df38ee2de4617", package = "ores-middleware", default-features = false, optional = true }

[workspace]
