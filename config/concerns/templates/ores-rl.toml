# Derived from ores-rate-limit/ores-rl-lib-core/.ores-rl.toml.example.
schemaVersion = "ores.rate-limit.config.v1"
layout = "combined"
defaultPolicyId = "api-default"

[client]
root = "client"
exposePolicyMetadata = true

[server]
root = "server"
backend = "redis"
enforcementLayer = "service"
redisUrlEnv = "REDIS_URL"
keyHmacEnv = "ORES_RL_HMAC_KEY"

[[policies]]
policyId = "api-default"
clientVisible = true
algorithm = "token-bucket"
identityScope = "authenticated-subject"
capacity = 120
windowMs = 0
refillTokens = 120
refillIntervalMs = 60000
requestCost = 1
enforcementMode = "enforce"
consistencyMode = "strict"
backendFailureMode = "fail-closed"
denyCacheMode = "local-denials"
denyCacheCapacity = 1024
maxOvershoot = 0
maxBlockTtlMs = 60000
keyVersion = "v1"
policyVersion = 1
