# `.shared-auth.toml` is canonical. `.auth-shared.toml` is a compatibility alias;
# generated repositories must never keep both filenames at once.
# Secret-free policy only: runtime credentials remain environment/secret-store owned.
schema_version = 1

[compatibility]
repository = "https://github.com/shared-auth/shared-auth-interfaces"
commit = "52b7ac7fbf0c7c169684f613eda923f3aa6c82e9"

[factors.two_factor]
required = true
methods = ["totp", "passkey", "security-key"]

[factors.three_factor]
enabled = false
methods = ["totp", "passkey", "security-key"]

[pages]
show = ["sign-in", "sign-up", "challenge", "recovery", "consent", "error", "signed-out"]

[styling]
theme = "system"
brand_name = "__PREFIX__"
accent_color = "#4F46E5"
