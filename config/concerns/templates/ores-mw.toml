# Derived from ORESoftware/ores-middleware/.ores-mw.toml at the catalogued source_revision.
#
# `stack_config` must resolve inside the generated repository. The owner repository's
# `contracts/fixtures/stack.minimal.json` is a *test* fixture (environment = "test",
# `test-auth-bypass` and `fault-injection` capabilities) and must never be copied into a
# deployable function. The consumer supplies a reviewed production stack JSON at the path
# below, validated against the owner's peer-authority MiddlewareStackConfig contract;
# scripts/enable-concern.sh refuses to materialize this file until it exists.
schema_version = 1
repository_mode = "server-only"
default_target = "portable-adapters"

[[targets]]
name = "portable-adapters"
role = "server"
roots = ["src"]
middleware = "stack"
stack_config = "config/ores-middleware.stack.json"
