schema_version = 1

# Always-on baseline. This file already lives at the generated repository root.
[[concerns]]
id = "otel"
canonical_file = ".ores-otel.toml"
owner = "https://github.com/ores-otel"
mode = "required"
template = ""

[[concerns]]
