mode = "optional"
template = "config/concerns/templates/ores-chat.toml"
tjsv_required = true
typespec = "contracts/ores-chat-config/ores-chat-config.tsp"
json_schema = "contracts/ores-chat-config/ores-chat-config.schema.json"

[[concerns]]
id = "shared-auth"
canonical_file = ".shared-auth.toml"
aliases = [".auth-shared.toml"]
owner = "https://github.com/shared-auth/shared-auth-interfaces"
source_revision = "52b7ac7fbf0c7c169684f613eda923f3aa6c82e9"
mode = "optional"
template = "config/concerns/templates/shared-auth.toml"

# Recognized fleet contracts whose owner schema/example must be reviewed before
