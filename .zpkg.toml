[package]
org = "__ORG__"
name = "__PREFIX__-lambdas"
version = "0.1.0"
description = "Provider-neutral serverless functions for __ORG__"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/__ORG__/__PREFIX__-lambdas"

[dependencies]
"flags-2-env/flags-2-env" = "^0.3.0"
"oresoftware/next-loggers" = "^0.1.0"

[install]
dir = ".vendor/.zed"

[targets.repository]
dir = "."
adapter = "none"

[targets.rust]
dir = "."
adapter = "rust"

[targets.contracts]
dir = "contracts"
adapter = "none"

[targets.conformance]
dir = "conformance"
adapter = "none"

[build]
command = "cargo build --locked --release --features http,portable"

[scripts]
test = "sh conformance/check.sh"
conformance = "sh conformance/check.sh"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "target/**", "**/*.log", ".vendor/**"]
