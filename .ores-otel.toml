# Canonical ORES telemetry policy. Structural semantics are owned by
# ores-otel/ores-otel-interfaces OresOtelConfigV1.
version = 1

[server]
enabled = true
service_name = "__PREFIX__-lambdas"

[server.logging]
enabled = true
level = "info"
console = true
auto_send = false

[server.tracing]
enabled = true
sample_ratio = 1.0
propagators = ["tracecontext", "baggage"]

[server.metrics]
enabled = true
exemplars = true
span_metrics = true
service_graphs = true

[server.exporter]
protocol = "otlp_http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"

# OTEL_EXPORTER_OTLP_HEADERS is intentionally not represented here: it is
# credential-bearing runtime environment state and must never receive a
# plaintext TOML default or public CLI flag.
