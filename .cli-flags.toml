# Sole argv/alias/type/default authority for lambda binaries.
# Runtime secrets are environment/secret-store inputs and are never CLI flags.
[help]
url = "https://github.com/__ORG__/__PREFIX__-lambdas"

[env]
dotenv = false
files = []

[parse]
allow_unknown = false

[flags.port]
type = "integer"
env = "PORT"
help = "Listen port (Google Cloud Run sets PORT)."

[flags.functions_customhandler_port]
type = "integer"
env = "FUNCTIONS_CUSTOMHANDLER_PORT"
aliases = ["functions-customhandler-port"]
help = "Azure Functions custom-handler port; takes precedence over PORT when present."

[flags.bind]
type = "string"
env = "LAMBDAS_BIND"
default = "0.0.0.0"
help = "Bind address."
