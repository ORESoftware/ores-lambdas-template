# Supply-chain policy for generated Lambda repositories.
# Keep this small and fail closed: crates.io is the only registry, and the
# independently maintained flags-2-env repository is the only admitted Git source.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.8
# This is intentionally the exact all-features license set currently encountered
# by the template graph. Dependency upgrades that add a license require review.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "BSL-1.0",
  "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# cargo-deny models git/path dependencies as wildcard requirements. This package
# is intentionally private (publish=false), and exact git provenance is enforced
# independently below with allow-git + required-git-spec="rev".
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
unused-allowed-source = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/flags-2-env/flags-2-env"]
