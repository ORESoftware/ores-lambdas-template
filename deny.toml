# Supply-chain policy for generated Lambda repositories.
# Keep this small and fail closed: crates.io is the only registry, and the
# independently maintained flags-2-env repository is the only admitted Git source.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "OpenSSL",
  "CC0-1.0",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/flags-2-env/flags-2-env"]
