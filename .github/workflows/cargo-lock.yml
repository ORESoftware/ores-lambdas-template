name: Cargo lock supply chain

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/cargo-lock.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/cargo-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lock-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          show-progress: false

      - name: Verify checked-out revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Install declared Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.88'

      - name: Generate candidate only when the repository has no lock
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Cargo.lock ]; then
            echo 'validating committed Cargo.lock'
          else
            echo 'Cargo.lock is absent; generating a reviewable candidate'
            cargo generate-lockfile
          fi
          cargo metadata --locked --all-features --format-version 1 >/dev/null

      - name: Audit immutable source and checksum coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path('Cargo.lock').read_text(encoding='utf-8'))
          packages = lock.get('package', [])
          if not packages:
              raise SystemExit('Cargo.lock contains no packages')

          for package in packages:
              name = package.get('name', '<unknown>')
              source = package.get('source')
              if not source:
                  continue
              if source.startswith('git+'):
                  fragment = source.rsplit('#', 1)[-1]
                  if not re.fullmatch(r'[0-9a-f]{40}', fragment):
                      raise SystemExit(f'git dependency is not immutable in Cargo.lock: {name}')
              elif source.startswith('registry+'):
                  checksum = package.get('checksum')
                  if not isinstance(checksum, str) or not re.fullmatch(r'[0-9a-f]{64}', checksum):
                      raise SystemExit(f'registry dependency lacks a SHA-256 checksum: {name}')
              else:
                  raise SystemExit(f'unapproved Cargo source scheme for {name}: {source}')
          PY

      - name: Record exact lock digest
        shell: bash
        run: sha256sum Cargo.lock > Cargo.lock.sha256

      - name: Retain exact lock candidate or committed-lock evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-lock-${{ github.run_id }}
          path: |
            Cargo.lock
            Cargo.lock.sha256
          if-no-files-found: error
          retention-days: 30
