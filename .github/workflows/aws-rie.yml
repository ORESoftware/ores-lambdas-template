name: AWS Lambda RIE parity

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'scripts/test-aws-rie.sh'
      - '.github/workflows/aws-rie.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'scripts/test-aws-rie.sh'
      - '.github/workflows/aws-rie.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lambda-rie-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_RIE_VERSION: '1.37'
  AWS_RIE_X86_64_SHA256: '6b1e686e62ab2baf5759c412c4864276ef2a88b094fca53ec070637ccba9b9a5'

jobs:
  rie:
    name: AWS Runtime Interface Emulator invocation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install the declared Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.88'

      - name: Build the AWS runtime from the committed lockfile
        run: cargo build --locked --bin worker-aws --features aws

      - name: Install checksum-pinned AWS Lambda RIE
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/aws/aws-lambda-runtime-interface-emulator/releases/download/v${AWS_RIE_VERSION}/aws-lambda-rie-x86_64"
          curl --fail --location --silent --show-error --retry 3 --proto '=https' --tlsv1.2 \
            "$url" --output /tmp/aws-lambda-rie
          printf '%s  %s\n' "$AWS_RIE_X86_64_SHA256" /tmp/aws-lambda-rie | sha256sum --check --strict
          chmod 0555 /tmp/aws-lambda-rie

      - name: Invoke accepted and rejected envelopes through RIE
        run: sh scripts/test-aws-rie.sh /tmp/aws-lambda-rie target/debug/worker-aws
