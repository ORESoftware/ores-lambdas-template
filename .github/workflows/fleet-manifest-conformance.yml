name: fleet manifest conformance

on:
  pull_request:
    paths:
      - '.ores-lambda.toml'
      - '.ores-mw.toml'
      - '.ores-otel.toml'
      - '.zpkg.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'config/**'
      - 'contracts/**'
      - 'conformance/**'
      - 'src/**'
      - 'scripts/check-fleet-repository.py'
      - '.github/workflows/fleet-manifest-conformance.yml'
  push:
    branches: [main]
    paths:
      - '.ores-lambda.toml'
      - '.ores-mw.toml'
      - '.ores-otel.toml'
      - '.zpkg.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'config/**'
      - 'contracts/**'
      - 'conformance/**'
      - 'src/**'
      - 'scripts/check-fleet-repository.py'
      - '.github/workflows/fleet-manifest-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-manifest-conformance-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  ORES_LAMBDA_AUTHORITY_SHA: cc7e5da3b42a75f8b172d85bf13a0c2844c2d431

jobs:
  repository-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact reviewed Lambda repository head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          show-progress: false

      - name: Verify exact reviewed source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Run pinned executable fleet admission mirror
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-fleet-repository.py \
            --root . \
            --authority-sha "${ORES_LAMBDA_AUTHORITY_SHA}"

      - name: Verify repository structural lifecycle
        shell: bash
        run: sh conformance/check.sh --structural-only

      - name: Record bootstrap authority boundary
        shell: bash
        run: |
          set -euo pipefail
          cat <<EOF
          Canonical semantic authority: ORESoftware/ores-lambda@${ORES_LAMBDA_AUTHORITY_SHA}
          Consumer-local executable mirror: scripts/check-fleet-repository.py
          Mirror removal condition: consume the reviewed oresoftware/ores-lambda Zed package or an automatically triggered central-authority receipt.
          The mirror additionally enforces the repo-owned Cargo-entrypoint rule tracked in ORESoftware/ores-lambda#9.
          EOF
