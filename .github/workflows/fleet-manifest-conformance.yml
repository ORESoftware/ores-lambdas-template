name: fleet manifest conformance

on:
  pull_request:
    paths:
      - '.ores-lambda.toml'
      - '.ores-mw.toml'
      - '.ores-otel.toml'
      - '.zpkg.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'config/**'
      - 'contracts/**'
      - 'conformance/**'
      - 'src/**'
      - 'scripts/check-fleet-repository.py'
      - '.github/workflows/fleet-manifest-conformance.yml'
  push:
    branches: [main]
    paths:
      - '.ores-lambda.toml'
      - '.ores-mw.toml'
      - '.ores-otel.toml'
      - '.zpkg.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'config/**'
      - 'contracts/**'
      - 'conformance/**'
      - 'src/**'
      - 'scripts/check-fleet-repository.py'
      - '.github/workflows/fleet-manifest-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-manifest-conformance-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  ORES_LAMBDA_AUTHORITY_SHA: cc7e5da3b42a75f8b172d85bf13a0c2844c2d431

jobs:
  repository-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact reviewed Lambda repository head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          show-progress: false

      - name: Verify exact reviewed source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Run pinned executable fleet admission mirror
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-fleet-repository.py \
            --root . \
            --authority-sha "${ORES_LAMBDA_AUTHORITY_SHA}"

      - name: Prove undeclared Cargo entrypoint fails closed
        shell: bash
        run: |
          set -euo pipefail
          cp .ores-lambda.toml "${RUNNER_TEMP}/ores-lambda.toml"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.ores-lambda.toml')
          source = path.read_text(encoding='utf-8')
          needle = 'entrypoint = "worker-http"'
          if source.count(needle) != 1:
              raise SystemExit(f'expected exactly one {needle!r} before drift mutation')
          path.write_text(source.replace(needle, 'entrypoint = "missing-worker"', 1), encoding='utf-8')
          PY
          set +e
          python3 scripts/check-fleet-repository.py \
            --root . \
            --authority-sha "${ORES_LAMBDA_AUTHORITY_SHA}" \
            >"${RUNNER_TEMP}/entrypoint-drift.stdout" \
            2>"${RUNNER_TEMP}/entrypoint-drift.stderr"
          rc=$?
          set -e
          mv "${RUNNER_TEMP}/ores-lambda.toml" .ores-lambda.toml
          if [ "$rc" -ne 2 ]; then
            cat "${RUNNER_TEMP}/entrypoint-drift.stdout" >&2 || true
            cat "${RUNNER_TEMP}/entrypoint-drift.stderr" >&2 || true
            echo "expected undeclared entrypoint drift to fail with exit 2, got $rc" >&2
            exit 1
          fi
          grep -F "entrypoint 'missing-worker' is not a Cargo binary" "${RUNNER_TEMP}/entrypoint-drift.stderr"
          git diff --exit-code -- .ores-lambda.toml

      - name: Verify repository structural lifecycle
        shell: bash
        run: sh conformance/check.sh --structural-only

      - name: Record bootstrap authority boundary
        shell: bash
        run: |
          set -euo pipefail
          cat <<EOF
          Canonical semantic authority: ORESoftware/ores-lambda@${ORES_LAMBDA_AUTHORITY_SHA}
          Consumer-local executable mirror: scripts/check-fleet-repository.py
          Mirror removal condition: consume the reviewed oresoftware/ores-lambda Zed package or an automatically triggered central-authority receipt.
          The mirror additionally enforces the repo-owned Cargo-entrypoint rule tracked in ORESoftware/ores-lambda#9.
          EOF
