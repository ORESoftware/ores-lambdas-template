name: fleet manifest conformance

on:
  pull_request:
    paths:
      - '.ores-lambda.toml'
      - '.ores-mw.toml'
      - '.zpkg.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'contracts/**'
      - 'conformance/**'
      - 'src/**'
      - '.github/workflows/fleet-manifest-conformance.yml'
  push:
    branches: [main]
    paths:
      - '.ores-lambda.toml'
      - '.ores-mw.toml'
      - '.zpkg.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'contracts/**'
      - 'conformance/**'
      - 'src/**'
      - '.github/workflows/fleet-manifest-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  repository-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact reviewed Lambda repository head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          show-progress: false

      - name: Verify exact reviewed source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Verify local fleet authority envelope
        shell: bash
        run: |
          set -euo pipefail
          for path in .ores-lambda.toml .ores-mw.toml .ores-otel.toml config/ores-middleware.stack.json; do
            test -f "${path}"
            test ! -L "${path}"
          done
          test "$(wc -c < .ores-lambda.toml)" -le 262144
          grep -Eq '^schema_version = "ores\.lambda\.manifest/v1"$' .ores-lambda.toml
          grep -Eq '^\[middleware\]$' .ores-lambda.toml
          grep -Eq '^required = true$' .ores-lambda.toml
          grep -Eq '^execution = "invocation"$' .ores-lambda.toml
          grep -Eq '^fail_closed = true$' .ores-lambda.toml
          grep -Eq '^middleware_required = true$' .ores-lambda.toml
          grep -Eq '^ingress_path_prefix = "/__ores/lambda/[A-Za-z0-9._-]+"$' .ores-lambda.toml

      - name: Verify repository structural lifecycle
        shell: bash
        run: sh conformance/check.sh --structural-only

      - name: Explain central semantic admission
        shell: bash
        run: |
          cat <<'EOF'
          Local consumer CI intentionally does not clone the private ORESoftware/ores-lambda repository.
          Exact semantic `ores-lambda check` / `check-repo` admission is run from the central authority
          against this public consumer SHA, so no cross-repository read credential is required here.
          EOF
