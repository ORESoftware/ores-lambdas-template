name: ores-cli policy canary

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ORESC_REV: 3d0b34bf8e93c382114bca888dbecddc32678b50
  RUST_TOOLCHAIN: 1.95.0

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Require private ores-cli read credential
        shell: bash
        env:
          GH_READ_TOKEN: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_READ_TOKEN:-}" ]; then
            echo '::error::FLEET_GITHUB_READ_TOKEN is required to read the private ORESoftware/ores-cli canary source' >&2
            exit 1
          fi

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Fetch and build exact ores-cli candidate
        shell: bash
        env:
          GH_READ_TOKEN: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/ores-cli"
          askpass="$RUNNER_TEMP/ores-cli-askpass.sh"
          rm -rf "$tool"
          git init "$tool"
          git -C "$tool" remote add origin https://github.com/ORESoftware/ores-cli.git
          cat >"$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          if ! GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git -C "$tool" fetch --depth=1 origin "$ORESC_REV"; then
            rm -f "$askpass"
            echo '::error::FLEET_GITHUB_READ_TOKEN cannot read the pinned ORESoftware/ores-cli revision' >&2
            exit 1
          fi
          rm -f "$askpass"
          git -C "$tool" checkout --detach FETCH_HEAD
          test "$(git -C "$tool" rev-parse HEAD)" = "$ORESC_REV"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/oresc-target"
          cargo +"$RUST_TOOLCHAIN" build --locked --manifest-path "$tool/Cargo.toml" --bin oresc
          install -d "$RUNNER_TEMP/oresc-bin"
          install -m 0755 "$CARGO_TARGET_DIR/debug/oresc" "$RUNNER_TEMP/oresc-bin/oresc"
          echo "$RUNNER_TEMP/oresc-bin" >> "$GITHUB_PATH"

      - name: Audit repository and root TOML contracts
        run: oresc --no-json audit repo --path .

      - name: Audit environment declaration/reference coverage
        run: oresc --no-json audit env --path .