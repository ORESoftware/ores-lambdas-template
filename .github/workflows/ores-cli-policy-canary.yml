name: ores-cli policy canary

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ORESC_REV: 3d0b34bf8e93c382114bca888dbecddc32678b50
  RUST_TOOLCHAIN: 1.95.0

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Require private-source read credential
        env:
          FLEET_TOKEN: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLEET_TOKEN" || {
            echo 'FLEET_GITHUB_READ_TOKEN is unavailable to this repository' >&2
            exit 1
          }

      - name: Check out exact ores-cli candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-cli
          ref: ${{ env.ORESC_REV }}
          token: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
          path: .ci/ores-cli
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Build exact ores-cli candidate
        shell: bash
        run: |
          set -euo pipefail
          tool="$GITHUB_WORKSPACE/.ci/ores-cli"
          test "$(git -C "$tool" rev-parse HEAD)" = "$ORESC_REV"
          test -z "$(git -C "$tool" status --porcelain)"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/oresc-target"
          cargo +"$RUST_TOOLCHAIN" build --locked --manifest-path "$tool/Cargo.toml" --bin oresc
          install -d "$RUNNER_TEMP/oresc-bin"
          install -m 0755 "$CARGO_TARGET_DIR/debug/oresc" "$RUNNER_TEMP/oresc-bin/oresc"
          echo "$RUNNER_TEMP/oresc-bin" >> "$GITHUB_PATH"
          rm -rf "$GITHUB_WORKSPACE/.ci"

      - name: Audit repository and root TOML contracts
        run: oresc --no-json audit repo --path .

      - name: Audit environment declaration/reference coverage
        run: oresc --no-json audit env --path .
