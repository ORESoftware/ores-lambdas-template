name: flags2env-certification

on:
  pull_request:
    paths:
      - ".cli-flags.toml"
      - "src/bin/worker_http.rs"
      - "Dockerfile"
      - "Containerfile"
      - "tests/flags2env_certification.rs"
      - ".github/workflows/flags2env-certification.yml"
  push:
    branches: [main]
    paths:
      - ".cli-flags.toml"
      - "src/bin/worker_http.rs"
      - "Dockerfile"
      - "Containerfile"
      - "tests/flags2env_certification.rs"
      - ".github/workflows/flags2env-certification.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Execute dependency-independent certification guards
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          rustc --edition=2021 --test tests/flags2env_certification.rs -o "$RUNNER_TEMP/flags2env-certification"
          "$RUNNER_TEMP/flags2env-certification" --nocapture
