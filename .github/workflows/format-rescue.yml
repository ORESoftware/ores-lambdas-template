name: One-shot Rust formatting rescue

on:
  push:
    branches:
      - wip/rescue-20260905
    paths:
      - .github/workflows/format-rescue.yml

permissions:
  contents: write

concurrency:
  group: format-rescue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install the declared Rust formatter
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88"
          components: rustfmt

      - name: Format and constrain the mutation set
        shell: bash
        run: |
          set -euo pipefail
          before_lock="$(sha256sum Cargo.lock)"
          cargo fmt --all
          test "$(sha256sum Cargo.lock)" = "${before_lock}"
          unexpected="$(git diff --name-only | grep -Ev '\.rs$' || true)"
          test -z "${unexpected}" || {
            printf 'formatter changed a non-Rust path:\n%s\n' "${unexpected}" >&2
            exit 1
          }
          git diff --check

      - name: Commit only canonical Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          git add -- '*.rs' ':(glob)**/*.rs'
          if git diff --cached --quiet; then
            echo 'Rust sources are already canonical'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply canonical Rust 1.88 formatting'
          git push origin "HEAD:${GITHUB_REF_NAME}"
