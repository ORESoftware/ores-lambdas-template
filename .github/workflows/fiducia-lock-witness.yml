name: fiducia lock witness

on:
  pull_request:
    paths:
      - '.evidence/fiducia-lock/**'
      - '.github/workflows/fiducia-lock-witness.yml'

permissions:
  contents: write

env:
  WITNESS_DIR: .evidence/fiducia-lock

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out witness branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          show-progress: false
      - name: Install fleet Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.88'
      - name: Generate dependency lock without executing consumer code
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path "${WITNESS_DIR}/Cargo.toml"
          cargo metadata --locked --manifest-path "${WITNESS_DIR}/Cargo.toml" --all-features --format-version 1 >/dev/null
          sha256sum "${WITNESS_DIR}/Cargo.lock" | tee "${RUNNER_TEMP}/Cargo.lock.sha256"
      - name: Commit generated lock to witness branch
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${WITNESS_DIR}/Cargo.lock"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: retain generated Fiducia lock witness'
          git push origin "HEAD:${BRANCH}"
      - name: Retain generated lock evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fiducia-cargo-lock-${{ github.run_id }}
          path: |
            .evidence/fiducia-lock/Cargo.lock
            ${{ runner.temp }}/Cargo.lock.sha256
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
