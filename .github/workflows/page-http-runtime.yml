name: page-http-runtime

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  page-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - name: Install declared Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - name: Verify formatting
        run: cargo fmt --all --check
      - name: Compile and test browser-page hosts
        run: cargo test --features page-aws,page-gcp --lib
      - name: Lint browser-page hosts
        run: cargo clippy --features page-aws,page-gcp --lib -- -D warnings
      - name: Verify provider feature graph is explicit
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --features page-aws --edges features | grep -F 'lambda_runtime'
          cargo tree --features page-gcp --edges features | grep -F 'axum'
      - name: Retain resolved lock evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: page-http-runtime-lock-${{ github.run_id }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
