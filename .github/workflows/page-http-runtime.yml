name: page-http-runtime

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Temporary write permission is used only by the explicitly branch-scoped
# Cargo.lock refresh step below. It is removed again as soon as Cargo commits
# the exact lockfile for the repinned api-docs revision.
permissions:
  contents: write

jobs:
  page-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          show-progress: false
      - name: Install declared Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - name: Regenerate exact dependency lock for the repinned runtime
        run: cargo generate-lockfile
      - name: Verify locked metadata
        run: cargo metadata --locked --all-features --format-version 1 >/dev/null
      - name: Verify formatting
        run: cargo fmt --all --check
      - name: Compile and test browser-page hosts
        run: cargo test --locked --features page-aws,page-gcp --lib
      - name: Lint browser-page hosts
        run: cargo clippy --locked --features page-aws,page-gcp --lib -- -D warnings
      - name: Verify provider feature graph is explicit
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked --features page-aws --edges features | grep -F 'lambda_runtime'
          cargo tree --locked --features page-gcp --edges features | grep -F 'axum'
      - name: Commit Cargo-generated lock for this draft branch
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'draft/web-page-lambda-runtime' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore: refresh page runtime Cargo.lock'
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Retain resolved lock evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: page-http-runtime-lock-${{ github.run_id }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
