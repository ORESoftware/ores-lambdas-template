name: Lambda Rust supply chain

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'deny.toml'
      - '.github/workflows/supply-chain.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'deny.toml'
      - '.github/workflows/supply-chain.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lambda-supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-deny:
    name: Cargo bans, licenses and sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Enforce dependency supply-chain policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 / cargo-deny 0.20.2
        with:
          command: check bans licenses sources
          arguments: --all-features
          rust-version: '1.88'
