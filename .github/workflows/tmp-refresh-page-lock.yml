name: temporary refresh page runtime lock

on:
  push:
    branches:
      - draft/web-page-lambda-runtime

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.repository == 'ORESoftware/ores-lambdas-template'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: draft/web-page-lambda-runtime
          persist-credentials: true
          show-progress: false
      - name: Install declared Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.88'
      - name: Regenerate and validate exact lock
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo metadata --locked --all-features --format-version 1 >/dev/null
      - name: Commit Cargo-generated lock when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore: refresh page runtime Cargo.lock'
          git push origin HEAD:draft/web-page-lambda-runtime
