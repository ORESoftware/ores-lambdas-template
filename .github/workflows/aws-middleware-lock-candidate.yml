name: aws middleware lock candidate

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/aws-middleware-lock-candidate.yml

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          show-progress: false

      - name: Install declared Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88"

      - name: Generate and verify Cargo lock candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p ores-middleware --precise 9d81ca1e75817d2c5d76f0bc59619b4e0c3e5fd9
          grep -F 'rev=9d81ca1e75817d2c5d76f0bc59619b4e0c3e5fd9' Cargo.lock
          cargo metadata --locked --all-features --format-version 1 >/dev/null
          git diff --check -- Cargo.lock

      - name: Retain generated lock candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-middleware-cargo-lock-${{ github.run_id }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
