name: aws middleware lock candidate

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/aws-middleware-lock-candidate.yml

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out same-repository PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          show-progress: false
      - name: Install declared Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88"
      - name: Generate and verify Cargo lock candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p ores-middleware --precise 3373e139a03ffa27f7ecb0c97e5df38ee2de4617
          grep -F 'rev=3373e139a03ffa27f7ecb0c97e5df38ee2de4617' Cargo.lock
          cargo metadata --locked --all-features --format-version 1 >/dev/null
          git diff --check -- Cargo.lock
      - name: Commit generated lock when it changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already matches the reviewed dependency graph'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- Cargo.lock
          git commit -m 'chore: pin merged middleware Cargo lock'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
      - name: Retain generated lock candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-middleware-cargo-lock-${{ github.run_id }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
