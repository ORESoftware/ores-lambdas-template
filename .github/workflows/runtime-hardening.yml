name: runtime hardening

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'Containerfile'
      - 'entrypoint.sh'
      - '.cli-flags.toml'
      - '.github/workflows/runtime-hardening.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'Containerfile'
      - 'entrypoint.sh'
      - '.cli-flags.toml'
      - '.github/workflows/runtime-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  adapter-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          show-progress: false

      - name: Verify checked-out revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Install declared Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.88'
          components: rustfmt, clippy

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Verify committed dependency graph
        run: cargo metadata --locked --all-features --format-version 1 >/dev/null

      - name: Compile every adapter independently
        shell: bash
        run: |
          set -euo pipefail
          for feature in aws http portable vercel; do
            echo "checking isolated adapter feature: ${feature}"
            cargo check --locked --no-default-features --features "${feature}" --all-targets
          done

      - name: Test all adapter features together
        run: cargo test --locked --all-features --all-targets

      - name: Lint all adapter features together
        run: cargo clippy --locked --all-features --all-targets -- -D warnings

  oci-runtime-smoke:
    needs: adapter-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          show-progress: false

      - name: Verify checked-out revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build amd64 runtime image from the locked graph
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --build-arg VCS_REF="${EXPECTED_SHA}" \
            --tag lambdas-runtime-smoke:${EXPECTED_SHA} \
            --load .

      - name: Execute hardened probes and trusted-context invocation
        shell: bash
        run: |
          set -euo pipefail
          container="lambdas-runtime-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          response="${RUNNER_TEMP}/runtime-smoke-response.json"
          cleanup() {
            docker rm -f "${container}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM

          docker run --detach \
            --name "${container}" \
            --platform linux/amd64 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --env LAMBDA_SIDECAR_MODE=off \
            --publish 127.0.0.1:18080:8080 \
            "lambdas-runtime-smoke:${EXPECTED_SHA}" >/dev/null

          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz >/dev/null 2>&1; then
              ready=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "${container}")" != 'true' ]; then
              echo 'runtime container exited before becoming healthy' >&2
              docker logs "${container}" >&2 || true
              exit 1
            fi
            sleep 1
          done
          test "${ready}" -eq 1
          curl --fail --silent --show-error http://127.0.0.1:18080/readyz >/dev/null

          test "$(docker exec "${container}" id -u)" != '0'
          docker exec "${container}" sh -c 'test -r /app/.cli-flags.toml && test ! -w /app/.cli-flags.toml'
          if docker exec "${container}" sh -c 'touch /app/runtime-must-not-write'; then
            echo 'read-only runtime unexpectedly allowed a root-filesystem write' >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            --header 'content-type: application/json' \
            --header 'x-request-id: runtime-smoke' \
            --data '{"provider":"aws-lambda","requestId":"spoofed-body","command":{"schemaVersion":"__PREFIX__.worker-command.v1","operation":"health","payload":{}}}' \
            http://127.0.0.1:18080/invoke \
            --output "${response}"

          jq -e '
            .ok == true and
            .provider == "local" and
            .requestId == "runtime-smoke" and
            .requestId != "spoofed-body" and
            .result == {"status":"ok"}
          ' "${response}" >/dev/null
