[package]
name = "__PREFIX__-lambdas"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Provider-neutral Rust functions for __ORG__: one bounded command core, thin adapters for AWS Lambda, Cloud Run, Azure Functions, Vercel, Scintilla and local hosts."
license = "MIT"

[lib]
name = "__CRATE__"
path = "src/lib.rs"

[features]
default = []
aws = ["dep:lambda_runtime", "dep:tokio"]
http = ["dep:axum", "dep:tokio", "dep:flags2env"]
vercel = ["dep:vercel_runtime", "dep:tokio"]
portable = []

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
lambda_runtime = { version = "1.3.0", optional = true }
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread", "net", "signal"], optional = true }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "tokio"] }
vercel_runtime = { version = "1", optional = true }
# The canonical source moved to the flags-2-env organization; new source references must not
# target the read-only historical ORESoftware mirror. Keep an immutable revision for CI/rebuilds.
flags2env = { git = "https://github.com/flags-2-env/flags-2-env", rev = "333c2ace93c362d274171ab0e0edf613d96a8e59", package = "flags2env", optional = true }

[dev-dependencies]
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[bin]]
name = "health"
path = "src/bin/health.rs"
required-features = ["aws"]

[[bin]]
name = "worker-aws"
path = "src/bin/worker_aws.rs"
required-features = ["aws"]

[[bin]]
name = "worker-http"
path = "src/bin/worker_http.rs"
required-features = ["http"]

[[bin]]
name = "worker-portable"
path = "src/bin/worker_portable.rs"
required-features = ["portable"]

# Vercel's official Rust runtime discovers api/*.rs; the catch-all forwards every path to the core.
[[bin]]
name = "vercel-worker"
path = "api/[[...slug]].rs"
required-features = ["vercel"]

[lints.rust]
unsafe_code = "forbid"
# The raw template uses an uppercase placeholder crate target; scaffold.sh replaces it with a lowercase consumer crate name.
non_snake_case = "allow"

[lints.clippy]
all = "deny"
pedantic = "allow"
nursery = "allow"
